name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
  push:
    branches: [main]
    paths:
      - "infra/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write  # Required for OIDC authentication to GCP

env:
  TF_VERSION: "1.8.0"
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}

jobs:
  terraform-checks:
    name: Terraform Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/

      - name: Install tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Run tflint
        run: |
          for dir in infra/gcp/*/; do
            echo "Linting $dir"
            (cd "$dir" && tflint --init && tflint)
          done

      - name: Install checkov
        run: pip install checkov

      - name: Run checkov
        run: checkov -d infra/ --framework terraform --quiet --compact

  terraform-plan:
    name: Terraform Plan (dev)
    runs-on: ubuntu-latest
    needs: terraform-checks
    if: github.event_name == 'pull_request'
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP via OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SA_EMAIL }}

      - name: Terraform Init
        working-directory: infra/envs/gcp/dev
        run: terraform init

      - name: Terraform Validate
        working-directory: infra/envs/gcp/dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/envs/gcp/dev
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Comment Plan on PR
        uses: actions/github-script@v9
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Terraform Plan - Dev Environment
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Plan exit code: ${{ steps.plan.outcome }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform-apply:
    name: Terraform Apply (dev)
    runs-on: ubuntu-latest
    needs: terraform-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP via OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SA_EMAIL }}

      - name: Terraform Init
        working-directory: infra/envs/gcp/dev
        run: terraform init

      - name: Terraform Apply
        working-directory: infra/envs/gcp/dev
        run: terraform apply -auto-approve
