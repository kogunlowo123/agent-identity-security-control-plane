name: Bug Report
description: Report a bug in the Agent Identity Security Control Plane
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the form below completely.
        For security vulnerabilities, use the Security Finding template instead.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of what went wrong
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue
      placeholder: |
        1. Call POST /api/v1/identities/issue with...
        2. Observe that...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API Service
        - Token Broker
        - Agent Runtime
        - RAG Core
        - OPA Policies
        - Identity Registry
        - Infrastructure (Terraform)
        - CI/CD
        - Documentation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true
