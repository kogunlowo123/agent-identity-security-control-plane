apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images
  annotations:
    policies.kyverno.io/title: Require Signed Images
    policies.kyverno.io/description: >-
      All container images must be signed using cosign before deployment.
      This prevents unsigned or tampered images from running in the cluster.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-image-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [aicp]
      verifyImages:
        - imageReferences:
            - "gcr.io/*/aicp-*:*"
            - "ghcr.io/kogunlowo123/agent-identity-security-control-plane*:*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    rekor:
                      url: https://rekor.sigstore.dev
                    issuer: https://token.actions.githubusercontent.com
                    subject: "https://github.com/kogunlowo123/agent-identity-security-control-plane/.github/workflows/release.yml@refs/heads/main"
