guardrails:
  input_screening:
    enabled: true
    max_input_length: 8192
    block_patterns:
      - pattern: "(?i)(ignore|forget|disregard).{0,50}(instruction|system|prompt)"
        label: prompt_injection
        severity: high
      - pattern: "(?i)(jailbreak|dan mode|ignore previous)"
        label: jailbreak_attempt
        severity: critical
      - pattern: "(?i)(drop table|delete from|truncate|exec\\s*\\()"
        label: sql_injection
        severity: high
      - pattern: "(?i)(\\<script|javascript:|onerror=|onload=)"
        label: xss_attempt
        severity: high

  grounding:
    enabled: true
    threshold: 0.7
    require_citations: true
    min_citations: 1

  pii_detection:
    enabled: true
    entities:
      - PERSON
      - EMAIL_ADDRESS
      - PHONE_NUMBER
      - US_SSN
      - CREDIT_CARD
    action_on_detect: redact

  output_validation:
    enabled: true
    max_output_length: 32768
    require_grounding: true
