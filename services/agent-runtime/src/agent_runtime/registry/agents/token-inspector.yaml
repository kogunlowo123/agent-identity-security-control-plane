agent_id: token-inspector
display_name: Token Inspector
description: >
  Performs deep inspection of JWT tokens, validates cryptographic signatures,
  checks revocation status, and flags anomalous token usage patterns.
spiffe_id: spiffe://agent-identity-security-control-plane/agents/token-inspector
tier: T0
capabilities:
  - token:read
  - token:validate
  - token:revoke
  - revocation:write
  - jwks:read
max_ttl: 3600
max_delegation_depth: 0
tools:
  - identity_query
  - session_read
allowed_data_classifications:
  - public
  - internal
  - confidential
  - restricted
rate_limits:
  requests_per_minute: 1000
  tokens_per_minute: 200000
metadata:
  owner_team: platform-security
  contact: platform-security@example.com
  created_at: "2024-01-01"
  tags:
    - token
    - validation
    - security
