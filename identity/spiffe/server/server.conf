server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "agent-identity-security-control-plane"
    data_dir = "/opt/spire/data/server"
    log_level = "INFO"
    log_format = "JSON"

    ca_subject = {
        country = ["US"]
        organization = ["AICP"]
        common_name = ""
    }

    ca_ttl = "24h"
    default_svid_ttl = "1h"
    default_jwt_svid_ttl = "5m"
    jwt_issuer = "https://spire.aicp.example.com"
}

plugins {
    DataStore "k8s" {
        plugin_data {
            namespace = "aicp"
        }
    }

    NodeAttestor "k8s_psat" {
        plugin_data {
            clusters = {
                "aicp-cluster" = {
                    service_account_allow_list = ["aicp:api", "aicp:agent-runtime", "aicp:rag-core", "aicp:broker"]
                    use_token_review_api_validation = true
                }
            }
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }

    UpstreamAuthority "disk" {
        plugin_data {
            cert_file_path = "/opt/spire/conf/server/dummy_upstream_ca.crt"
            key_file_path = "/opt/spire/conf/server/dummy_upstream_ca.key"
        }
    }
}
