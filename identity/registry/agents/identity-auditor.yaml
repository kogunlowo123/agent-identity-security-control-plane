id: identity-auditor
name: Identity Auditor
description: >
  Reads agent identity records from the registry, generates audit reports
  grounded in SPIFFE specifications, NIST SP 800-207, and identity standards.
  Operates at trust tier T1 with read-only access to the identity registry.
spiffe_id: spiffe://agent-identity-security-control-plane/identity-auditor
tier: T1
status: active
capabilities:
  - read_identity_records
  - generate_audit_reports
  - rag_search
  - list_agents
  - check_token_status
authorized_tools:
  - rag_search
  - identity_query
  - token_status_check
max_delegation_depth: 2
metadata:
  team: security-platform
  owner: kogunlowo123
  environment: production
  langgraph_graph: identity_audit_graph
created_at: "2024-01-01T00:00:00Z"
updated_at: "2024-01-01T00:00:00Z"
