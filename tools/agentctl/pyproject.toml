[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentctl"
version = "0.1.0"
description = "CLI for managing Agent Identity Security Control Plane agents"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0",
    "jsonschema>=4.22.0",
    "rich>=13.7.0",
]

[project.scripts]
agentctl = "agentctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentctl"]
